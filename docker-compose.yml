version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: securemailscope-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securemailscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-securemailscope}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemailscope"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securemailscope-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: securemailscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - securemailscope-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemailscope-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securemailscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-securemailscope}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVIDENCE_STORAGE_PATH: /app/data/evidence
      MAX_PCAP_SIZE_MB: ${MAX_PCAP_SIZE_MB:-500}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-SecureAdmin123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - evidence_data:/app/data/evidence
    networks:
      - securemailscope-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securemailscope-worker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securemailscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-securemailscope}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVIDENCE_STORAGE_PATH: /app/data/evidence
      MAX_PCAP_SIZE_MB: ${MAX_PCAP_SIZE_MB:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - evidence_data:/app/data/evidence
    networks:
      - securemailscope-network
    command: celery -A app.core.celery_app worker --loglevel=info

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: securemailscope-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - securemailscope-network
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  evidence_data:

networks:
  securemailscope-network:
    driver: bridge
