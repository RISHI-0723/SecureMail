# =============================================================================
# SecureMailScope - Render Blueprint
# Version: 0.5.0
# SIH Demo Production Deployment
# =============================================================================

services:
  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  - type: web
    name: securemailscope-api
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: ./backend/Dockerfile.production
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: securemailscope-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securemailscope-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
        sync: false
      - key: CORS_ORIGINS
        value: https://securemailscope.onrender.com
      - key: MAX_PCAP_SIZE_MB
        value: 500
      - key: ML_ENABLED
        value: true
      - key: BLOCKCHAIN_ENABLED
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: EVIDENCE_STORAGE_PATH
        value: /app/data/evidence
      - key: REPORTS_STORAGE_PATH
        value: /app/data/reports
      - key: TSHARK_TIMEOUT_SECONDS
        value: 300
    preDeployCommand: alembic upgrade head
    disk:
      name: securemailscope-data
      mountPath: /app/data
      sizeGB: 20

  # ===========================================================================
  # Celery Background Worker
  # ===========================================================================
  - type: worker
    name: securemailscope-worker
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: ./backend/Dockerfile.production
    dockerContext: ./backend
    startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: securemailscope-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securemailscope-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: MAX_PCAP_SIZE_MB
        value: 500
      - key: ML_ENABLED
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: EVIDENCE_STORAGE_PATH
        value: /app/data/evidence
      - key: REPORTS_STORAGE_PATH
        value: /app/data/reports
      - key: TSHARK_TIMEOUT_SECONDS
        value: 300
    disk:
      name: securemailscope-worker-data
      mountPath: /app/data
      sizeGB: 20

  # ===========================================================================
  # Frontend - Static Site
  # ===========================================================================
  - type: web
    name: securemailscope-frontend
    runtime: static
    plan: starter
    region: singapore
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://securemailscope-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  - name: securemailscope-postgres
    databaseName: securemailscope
    user: securemailscope
    plan: standard
    region: singapore
    ipAllowList: []

  # ===========================================================================
  # Redis (for Celery broker and result backend)
  # ===========================================================================
  - name: securemailscope-redis
    plan: standard
    region: singapore
    ipAllowList: []
